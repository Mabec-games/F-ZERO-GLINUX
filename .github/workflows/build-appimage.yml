name: Build Portable AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Ubuntu 22.04 Portable AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y \
            gcc-13 g++-13 ninja-build cmake pkg-config \
            libgl1-mesa-dev libvulkan-dev libasound2-dev libpulse-dev libudev-dev libevdev-dev libsystemd-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libwayland-dev wayland-protocols libxkbcommon-dev \
            libcurl4-openssl-dev libbluetooth-dev libenet-dev libhidapi-dev \
            liblz4-dev libzstd-dev zlib1g-dev libfmt-dev libxxhash-dev \
            libbz2-dev libusb-1.0-0-dev libpugixml-dev fonts-noto-core libfuse2 file

      - name: Build F-ZERO GLINUX
        run: |
          export CC=gcc-13
          export CXX=g++-13
          export JOBS=$(nproc)
          export GLINUX_CMAKE_ARGS="-DCMAKE_C_FLAGS=-march=x86-64 -DCMAKE_CXX_FLAGS=-march=x86-64"
          # GCC 13 needs GLIBCXX_3.4.32, but Ubuntu 22.04, Debian 12 and SteamOS
          # only ship 3.4.30. linuxdeploy never bundles libstdc++, so link the
          # C++ runtime statically into our executables.
          export LDFLAGS="-static-libstdc++ -static-libgcc"
          bash scripts/build-glinux.sh

      - name: Download linuxdeploy
        run: |
          curl -sLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          echo "LINUXDEPLOY=$(realpath linuxdeploy-x86_64.AppImage)" >> $GITHUB_ENV

      - name: Package AppImage
        run: |
          # Release tags name the AppImage after the version, e.g. v0.9.3 -> 0.9.3.
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            export GLINUX_VERSION="${GITHUB_REF_NAME#v}"
          elif [ -z "${GLINUX_VERSION:-}" ]; then
            export GLINUX_VERSION="0.9.3"
          fi
          bash scripts/package-appimage.sh

      - name: Verify AppImage compatibility
        run: |
          APPIMAGE=$(ls dist/*.AppImage | head -n1)
          echo "Testing: $APPIMAGE"
          ./"$APPIMAGE" --appimage-extract-and-run --compatibility
          
          REQUIRED_GLIBC=$(cat dist/*.compatibility.txt | grep "Minimum required host glibc:" | awk '{print $NF}')
          echo "Detected minimum glibc requirement: $REQUIRED_GLIBC"
          # Verify that minimum glibc is <= 2.35 (Ubuntu 22.04 baseline)
          python3 -c "import sys; sys.exit(0 if float('$REQUIRED_GLIBC') <= 2.35 else 1)"

          # Verify no shipped ELF needs a newer libstdc++ than Ubuntu 22.04 /
          # Debian 12 provide (GLIBCXX_3.4.30).
          rm -rf squashfs-root && ./"$APPIMAGE" --appimage-extract >/dev/null
          MAX_GLIBCXX=$(find squashfs-root/usr -type f \( -perm -u+x -o -name '*.so*' \) -exec sh -c 'readelf -V "$1" 2>/dev/null' _ {} \; \
            | grep -oE 'GLIBCXX_[0-9]+\.[0-9]+\.[0-9]+' | sort -uV | tail -n1)
          echo "Highest GLIBCXX requirement: ${MAX_GLIBCXX:-none}"
          # Without the bundled font the launcher falls back to ImGui's pixel font.
          if [ ! -f squashfs-root/usr/bin/Assets/NotoSans-Medium.ttf ]; then
            echo "::error::NotoSans-Medium.ttf is missing from the AppImage"
            exit 1
          fi
          rm -rf squashfs-root
          if [ -n "$MAX_GLIBCXX" ] && [ "$(printf '%s\nGLIBCXX_3.4.30\n' "$MAX_GLIBCXX" | sort -V | tail -n1)" != "GLIBCXX_3.4.30" ]; then
            echo "::error::AppImage requires $MAX_GLIBCXX, newer than Ubuntu 22.04/Debian 12 (GLIBCXX_3.4.30)"
            exit 1
          fi

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: F-ZERO-GLINUX-AppImage
          path: |
            dist/*.AppImage
            dist/*.compatibility.txt
            dist/*.sha256
          retention-days: 14

  smoke-test:
    name: Smoke Test (${{ matrix.name }})
    needs: build
    runs-on: ${{ matrix.runs-on }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: 'Ubuntu 22.04 LTS (Jammy)'
            runs-on: ubuntu-22.04
            container: ''
          - name: 'Ubuntu 24.04 LTS (Noble)'
            runs-on: ubuntu-24.04
            container: ''
          - name: 'Debian 12 (Bookworm)'
            runs-on: ubuntu-latest
            container: 'debian:bookworm-slim'
          - name: 'Fedora 40'
            runs-on: ubuntu-latest
            container: 'fedora:40'

    steps:
      - name: Download AppImage Artifact
        uses: actions/download-artifact@v4
        with:
          name: F-ZERO-GLINUX-AppImage
          path: dist

      - name: Install desktop dependencies (container)
        if: matrix.container != ''
        run: |
          # Libraries a normal desktop install already has; linuxdeploy
          # deliberately leaves these to the host.
          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends \
              libx11-6 libxext6 libxrandr2 libxi6 libwayland-client0 libasound2 \
              libusb-1.0-0 libgl1 zlib1g ca-certificates file binutils
          elif command -v dnf >/dev/null 2>&1; then
            dnf install -y libX11 libXext libXrandr libXi libwayland-client alsa-lib \
              libusb1 mesa-libGL zlib file binutils
          fi

      - name: Smoke test AppImage
        shell: bash
        run: |
          set -euo pipefail
          chmod +x dist/*.AppImage
          APPIMAGE=$(ls dist/*.AppImage | head -n1)

          echo "=== Compatibility report on ${{ matrix.name }} ==="
          ./"$APPIMAGE" --appimage-extract-and-run --compatibility 2>&1

          echo "=== Unresolved libraries on ${{ matrix.name }} ==="
          ./"$APPIMAGE" --appimage-extract >/dev/null
          MISSING=$(LD_LIBRARY_PATH=squashfs-root/usr/lib ldd squashfs-root/usr/bin/ModernGekko squashfs-root/usr/bin/moderngekko-run 2>&1 \
            | grep -E "not found" || true)
          echo "${MISSING:-none}"

          echo "=== Launcher CLI test on ${{ matrix.name }} ==="
          ./"$APPIMAGE" --appimage-extract-and-run --help 2>&1
          [ -z "$MISSING" ]

  release:
    name: Publish Release Asset
    needs: [build, smoke-test]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@v4
        with:
          name: F-ZERO-GLINUX-AppImage
          path: dist

      - name: Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.compatibility.txt
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
