name: Build Portable AppImage

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: appimage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Ubuntu 22.04 Portable AppImage
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install -y \
            gcc-13 g++-13 ninja-build cmake \
            libgl1-mesa-dev libvulkan-dev libasound2-dev libpulse-dev libudev-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libwayland-dev wayland-protocols \
            libcurl4-openssl-dev libbluetooth-dev libenet-dev libhidapi-dev \
            liblz4-dev libzstd-dev zlib1g-dev libspng-dev libfmt-dev libxxhash-dev \
            libbz2-dev libusb-1.0-0-dev libpugixml-dev fonts-noto-core libfuse2 file

      - name: Build F-ZERO GLINUX
        run: |
          export CC=gcc-13
          export CXX=g++-13
          export JOBS=$(nproc)
          export GLINUX_CMAKE_ARGS="-DCMAKE_C_FLAGS=-march=x86-64 -DCMAKE_CXX_FLAGS=-march=x86-64"
          bash scripts/build-glinux.sh

      - name: Download linuxdeploy
        run: |
          curl -sLO https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          echo "LINUXDEPLOY=$(realpath linuxdeploy-x86_64.AppImage)" >> $GITHUB_ENV

      - name: Package AppImage
        run: |
          bash scripts/package-appimage.sh

      - name: Verify AppImage compatibility
        run: |
          APPIMAGE=$(ls dist/*.AppImage | head -n1)
          echo "Testing: $APPIMAGE"
          ./"$APPIMAGE" --appimage-extract-and-run --compatibility
          
          REQUIRED_GLIBC=$(cat dist/*.compatibility.txt | grep "Minimum required host glibc:" | awk '{print $NF}')
          echo "Detected minimum glibc requirement: $REQUIRED_GLIBC"
          # Verify that minimum glibc is <= 2.35 (Ubuntu 22.04 baseline)
          python3 -c "import sys; sys.exit(0 if float('$REQUIRED_GLIBC') <= 2.35 else 1)"

      - name: Upload AppImage Artifact
        uses: actions/upload-artifact@v4
        with:
          name: F-ZERO-GLINUX-AppImage
          path: |
            dist/*.AppImage
            dist/*.compatibility.txt
            dist/*.sha256
          retention-days: 14

      - name: Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.AppImage
            dist/*.compatibility.txt
            dist/*.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
